<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoL Skillshot Dodge Training</title>
<style>
  :root {
    --gold-primary: #c89b3c;
    --gold-light: #f0e6d2;
    --gold-dark: #785a28;
    --hex-blue: #0ac8b9;
    --bg-dark: #010a13;
    --panel-bg: rgba(9, 20, 40, 0.88);
    --panel-border: #1e282d;
    --danger-red: #e84057;
    --mana-blue: #1c88cf;
    --hp-green: #2ecc71;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-dark);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: var(--gold-light);
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at center, #0a1727 0%, #03080e 85%, #010508 100%);
  }

  /* Top HUD */
  #hud-top {
    position: absolute;
    top: 10px;
    left: 16px;
    right: 16px;
    height: 54px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }

  .hud-panel {
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(200, 155, 60, 0.15);
    border-radius: 6px;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    backdrop-filter: blur(8px);
    pointer-events: auto;
  }

  .stat-block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #a09b8c;
    font-weight: 700;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 800;
    color: var(--gold-light);
    text-shadow: 0 0 8px rgba(240, 230, 210, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .stat-value.highlight {
    color: var(--hex-blue);
    text-shadow: 0 0 8px rgba(10, 200, 185, 0.6);
  }

  .rank-badge {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #1e282d, #0f1923);
    border: 1px solid var(--gold-primary);
    color: var(--gold-primary);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 10px rgba(200, 155, 60, 0.2);
  }

  .rank-selector-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(1, 10, 19, 0.7);
    border: 1px solid var(--gold-dark);
    border-radius: 6px;
    padding: 2px 4px;
  }

  .rank-nav-btn {
    background: none;
    border: none;
    color: var(--gold-primary);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 4px;
    transition: all 0.15s ease;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rank-nav-btn:hover {
    background: rgba(200, 155, 60, 0.25);
    color: var(--gold-light);
    transform: scale(1.15);
  }

  .hex-select {
    background: linear-gradient(135deg, #1e282d, #0f1923);
    border: 1px solid var(--gold-primary);
    color: var(--gold-light);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    outline: none;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
  }

  .hex-select option {
    background: #091428;
    color: #f0e6d2;
    padding: 6px;
  }

  .hex-select:hover, .hex-select:focus {
    border-color: var(--hex-blue);
    box-shadow: 0 0 10px rgba(10, 200, 185, 0.5);
  }

  .modal-mode-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(1, 10, 19, 0.6);
    border: 1px solid var(--gold-dark);
    border-radius: 6px;
    padding: 8px 14px;
    margin-bottom: 20px;
  }

  .modal-mode-row .label {
    font-size: 11px;
    text-transform: uppercase;
    color: #a09b8c;
    letter-spacing: 1px;
    font-weight: 700;
  }

  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: default;
  }

  /* Bottom HUD / Spells */
  #hud-bottom {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 24px;
    z-index: 10;
    pointer-events: auto;
  }

  .spells-container {
    display: flex;
    gap: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--gold-dark);
    padding: 8px 16px;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.7);
  }

  .spell-slot {
    position: relative;
    width: 52px;
    height: 52px;
    background: #091428;
    border: 2px solid var(--gold-dark);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .spell-icon {
    font-size: 24px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }

  .spell-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    height: 0%;
    transition: height 0.1s linear;
  }

  .spell-key {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 10px;
    font-weight: 900;
    color: var(--gold-light);
    background: rgba(1, 10, 19, 0.85);
    padding: 1px 4px;
    border-radius: 3px;
    border: 1px solid var(--gold-dark);
  }

  .spell-cd-text {
    position: absolute;
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 0 6px #000;
    display: none;
  }

  .controls-tip {
    font-size: 11px;
    color: #8c9b9e;
    background: rgba(9, 20, 40, 0.8);
    border: 1px solid #1e282d;
    padding: 6px 12px;
    border-radius: 6px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .hud-btn {
    background: linear-gradient(180deg, #1e282d 0%, #091428 100%);
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .hud-btn:hover {
    border-color: var(--gold-primary);
    background: linear-gradient(180deg, #2d3e4b 0%, #11263c 100%);
    box-shadow: 0 0 10px rgba(200, 155, 60, 0.4);
    transform: translateY(-1px);
  }

  /* Modals / Overlays */
  #modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(1, 10, 19, 0.78);
    backdrop-filter: blur(6px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .defeat-card {
    background: radial-gradient(circle at top, #11263c 0%, #091428 65%, #050b14 100%);
    border: 2px solid var(--gold-primary);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(200, 155, 60, 0.25);
    border-radius: 12px;
    width: 440px;
    padding: 28px;
    text-align: center;
    position: relative;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .card-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--danger-red);
    text-shadow: 0 0 15px rgba(232, 64, 87, 0.6);
    margin-bottom: 4px;
  }

  .card-subtitle {
    font-size: 13px;
    color: #a09b8c;
    letter-spacing: 1px;
    margin-bottom: 24px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-cell {
    background: rgba(1, 10, 19, 0.6);
    border: 1px solid var(--gold-dark);
    border-radius: 6px;
    padding: 10px;
  }

  .stat-cell .label {
    font-size: 10px;
    text-transform: uppercase;
    color: #a09b8c;
    letter-spacing: 1px;
  }

  .stat-cell .val {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold-light);
    margin-top: 2px;
  }

  .restart-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(180deg, #c89b3c 0%, #785a28 100%);
    border: 1px solid #f0e6d2;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #010a13;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(200, 155, 60, 0.4);
    transition: all 0.2s ease;
  }

  .restart-btn:hover {
    background: linear-gradient(180deg, #e4b855 0%, #947134 100%);
    box-shadow: 0 0 25px rgba(240, 230, 210, 0.6);
    transform: translateY(-2px);
  }

  /* Floating notifications */
  .combo-streak {
    position: absolute;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--hex-blue);
    text-shadow: 0 0 15px rgba(10, 200, 185, 0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
  }

  .combo-streak.show {
    opacity: 1;
    transform: translateX(-50%) translateY(4px);
  }
</style>
</head>
<body oncontextmenu="return false;">

<div id="game-container">
  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-panel">
      <div class="rank-selector-group">
        <button class="rank-nav-btn" id="prevModeBtn" title="Previous Difficulty">◀</button>
        <div class="rank-badge" id="rankBadge">🛡️ Iron</div>
        <select id="modeSelect" class="hex-select" title="Switch Difficulty Mode">
          <option value="Auto">⚔️ Auto (Progressive)</option>

<script>
(() => {
  // --- Audio Synthesis via Web Audio API (100% Zero External Assets) ---
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
  }

  function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.2) {
    if (!soundEnabled || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function soundClick() { playTone(540, 'triangle', 0.05, 0.12); }
  function soundFlash() {
    if (!soundEnabled || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } catch (e) {}
  }

  function soundShield() {
    if (!soundEnabled || !audioCtx) return;
    playTone(440, 'sine', 0.3, 0.25);
  }

  function soundLaser() {
    if (!soundEnabled || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch (e) {}
  }

  function soundHit() {
    if (!soundEnabled || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } catch (e) {}
  }

  function soundCloseCall() { playTone(880, 'sine', 0.1, 0.15); }
  function soundRankUp() {
    [523, 659, 783, 1046].forEach((f, i) => {
      setTimeout(() => playTone(f, 'triangle', 0.2, 0.25), i * 80);
    });
  }

  // --- Canvas and Setup ---
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let width = 0;
  let height = 0;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // --- LoL Isometric 3D Perspective & Arena Engine ---
  let viewMode = localStorage.getItem('pm_lol_view_mode') || 'isometric'; // 'isometric' (default) or 'topdown'
  const ISO_PITCH = 0.68; // LoL 3/4 camera pitch angle

  function getScreenArenaBounds() {
    return {
      minX: 25,
      maxX: width - 25,
      minY: 60,
      maxY: height - 68
    };
  }

  function getScreenCenterY() {
    const s = getScreenArenaBounds();
    return (s.minY + s.maxY) / 2;
  }

  function worldToScreen(wx, wy, wz = 0) {
    if (viewMode === 'topdown') {
      return { x: wx, y: wy - wz };
    }
    const cy = getScreenCenterY();
    return {
      x: wx,
      y: cy + (wy - cy) * ISO_PITCH - wz
    };
  }

  function screenToWorld(sx, sy) {
    if (viewMode === 'topdown') {
      return { x: sx, y: sy };
    }
    const cy = getScreenCenterY();
    return {
      x: sx,
      y: cy + (sy - cy) / ISO_PITCH
    };
  }

  function getWorldArenaBounds() {
    const s = getScreenArenaBounds();
    if (viewMode === 'topdown') {
      return {
        minX: s.minX,
        maxX: s.maxX,
        minY: s.minY,
        maxY: s.maxY
      };
    }
    const topW = screenToWorld(width / 2, s.minY);
    const botW = screenToWorld(width / 2, s.maxY);
    return {
      minX: s.minX,
      maxX: s.maxX,
      minY: topW.y,
      maxY: botW.y
    };
  }

  function clampWorldPos(x, y, pad = 0) {
    const b = getWorldArenaBounds();
    return {
      x: Math.max(b.minX + pad, Math.min(b.maxX - pad, x)),
      y: Math.max(b.minY + pad, Math.min(b.maxY - pad, y))
    };
  }

  function setViewMode(mode) {
    if (viewMode === mode) return;
    const oldScreenPos = worldToScreen(player.x, player.y);
    viewMode = mode;
    localStorage.setItem('pm_lol_view_mode', viewMode);

    // Keep champion at the exact same screen location when switching camera
    const newWorldPos = screenToWorld(oldScreenPos.x, oldScreenPos.y);
    const clamped = clampWorldPos(newWorldPos.x, newWorldPos.y, player.radius + 5);
    player.x = clamped.x;
    player.y = clamped.y;
    player.destX = player.x;
    player.destY = player.y;

    const btn = document.getElementById('viewToggleBtn');
    if (btn) {
      btn.textContent = viewMode === 'isometric' ? '📐 3D Iso' : '🧭 2D Top';
    }
    addFloatingText(`VIEW: ${viewMode === 'isometric' ? 'ISOMETRIC 3D' : '2D TOP-DOWN'}`, player.x, player.y - 45, '#0ac8b9', 20);
  }

  function toggleViewMode() {
    setViewMode(viewMode === 'isometric' ? 'topdown' : 'isometric');
  }

  window.setViewMode = setViewMode;
  window.toggleViewMode = toggleViewMode;

  // --- Helper Math & Effects ---
  function dist(x1, y1, x2, y2) {
    const dx = x1 - x2;
    const dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function addParticleBurst(x, y, color, count = 16, maxSpeed = 160) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * maxSpeed + 20;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        color: color,
        alpha: 1.0,
        decay: Math.random() * 1.5 + 1.2,
        size: Math.random() * 4 + 2
      });
    }
  }

  function addFloatingText(text, x, y, color = '#f0e6d2', size = 16) {
    floatingTexts.push({
      text, x, y, color, size,
      alpha: 1.0,
      vy: -45,
      lifetime: 0.9
    });
  }

  function addClickRipple(x, y) {
    clickRipples.push({
      x, y,
      radius: 4,

    });

  // --- Flash Summoner Spell ---
  function castFlash() {
    if (player.flashCd > 0 || isGameOver) return;
    initAudio();

    // Flash towards cursor or facing direction in world coordinates
    const wMouse = screenToWorld(mousePos.x, mousePos.y);
    let targetX = wMouse.x;
    let targetY = wMouse.y;
    if (dist(player.x, player.y, targetX, targetY) < 10) {
      targetX = player.x + Math.cos(player.facingAngle) * 220;
      targetY = player.y + Math.sin(player.facingAngle) * 220;
    }

    const angle = Math.atan2(targetY - player.y, targetX - player.x);
    const flashDist = Math.min(240, dist(player.x, player.y, targetX, targetY));

    // Old location burst
    addParticleBurst(player.x, player.y, '#f1c40f', 24, 200);

    // Reposition
    player.x += Math.cos(angle) * flashDist;
    player.y += Math.sin(angle) * flashDist;

    // Bounds clamp
    const clampedFlash = clampWorldPos(player.x, player.y, player.radius + 10);
    player.x = clampedFlash.x;
    player.y = clampedFlash.y;
    player.destX = player.x;
    player.destY = player.y;

    // Arrival burst
    addParticleBurst(player.x, player.y, '#f1c40f', 20, 180);
    soundFlash();
    addFloatingText('FLASH!', player.x, player.y - 28, '#f1c40f', 18);

    player.flashCd = player.flashMaxCd;
  }

  // --- Dash / Shield Spell ---
  function castDash() {
    if (player.dashCd > 0 || isGameOver) return;
    initAudio();

    // Quick burst dash + 1s invuln shield in world coordinates
    const wMouse = screenToWorld(mousePos.x, mousePos.y);
    const angle = Math.atan2(wMouse.y - player.y, wMouse.x - player.x);
    const dashDist = 130;
    player.x += Math.cos(angle) * dashDist;
    player.y += Math.sin(angle) * dashDist;
    const clampedDash = clampWorldPos(player.x, player.y, player.radius + 10);
    player.x = clampedDash.x;
    player.y = clampedDash.y;
    player.destX = player.x;
    player.destY = player.y;

    player.shieldActive = true;
    player.shieldTime = 1.0;
    player.dashCd = player.dashMaxCd;

    addParticleBurst(player.x, player.y, '#0ac8b9', 18, 150);
    soundShield();
    addFloatingText('SHIELD!', player.x, player.y - 28, '#0ac8b9', 16);
  }

  // --- Projectile Spawning Logic ---
  function spawnSkillshot() {
    const bounds = getWorldArenaBounds();
    // Determine random edge of arena
    const edge = Math.floor(Math.random() * 4); // 0: Top, 1: Right, 2: Bottom, 3: Left
    let startX, startY;
    const pad = 40;

    switch (edge) {
      case 0: // Top
        startX = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
        startY = bounds.minY - pad;
        break;
      case 1: // Right
        startX = bounds.maxX + pad;
        startY = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
        break;
      case 2: // Bottom
        startX = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
        startY = bounds.maxY + pad;
        break;
      case 3: // Left
        startX = bounds.minX - pad;
        startY = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
        break;
    }

    // Aim with a slight offset around player position
    const spread = 70;
    const targetX = player.x + (Math.random() - 0.5) * spread;
    const targetY = player.y + (Math.random() - 0.5) * spread;
    const angle = Math.atan2(targetY - startY, targetX - startX);

    // Skillshot types
    const types = ['mystic', 'binding', 'rocket', 'orb', 'laser', 'bomb'];
    const weights = [30, 25, 18, 15, 12, 10]; // percentage probability
    
    // Choose weighted
    const roll = Math.random() * 110;
    let chosen = 'mystic';
    let cumulative = 0;
    for (let i = 0; i < types.length; i++) {
      cumulative += weights[i];
      if (roll <= cumulative) {
        chosen = types[i];
        break;
      }
    }

    // Progression speed multiplier based on active mode & rank
    const activeRank = getActiveRank();
    let speedMult = activeRank.speedMult;
    if (selectedMode === 'Auto') {
      speedMult *= (1.0 + Math.min(0.6, elapsedTime / 180));
    }

    if (chosen === 'laser') {
      // Lux Final Spark: telegraph line first, then lethal beam!
      lasers.push({
        x1: startX,
        y1: startY,
        angle: angle,
        length: Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY) * 1.8,
        chargeTime: activeRank.laserCharge, // dynamic charge time based on difficulty
        beamDuration: 0.35, // firing time
        state: 'charging',
        timer: 0,
        width: 44
      });
      return;
    }

    if (chosen === 'bomb') {
      // Ziggs Bomb: ground target circle
      bombs.push({
        x: targetX,
        y: targetY,
        radius: 70,
        fuse: 1.25,
        timer: 0,
        exploded: false
      });
      return;
    }

    // Regular / Special Projectiles
    let speed = 360 * speedMult;
    let radius = 16;
    let color = '#f1c40f';
    let name = 'Mystic Shot';
    let damage = 25;

    if (chosen === 'binding') {
      // Morgana Dark Binding: large, dark purple, slower but punishing
      speed = 260 * speedMult;
      radius = 26;
      color = '#9b59b6';
      name = 'Dark Binding';
      damage = 40;
    } else if (chosen === 'rocket') {
      // Jinx Super Mega Death Rocket: fast, dangerous
      speed = 460 * speedMult;
      radius = 20;
      color = '#e74c3c';
      name = 'Death Rocket';
      damage = 50;
    } else if (chosen === 'orb') {
      // Ahri Orb of Deception
      speed = 340 * speedMult;
      radius = 22;
      color = '#0ac8b9';
      name = 'Orb of Deception';
      damage = 30;
    }

    projectiles.push({
      x: startX,
      y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: radius,
      color: color,
      name: name,
      damage: damage,
      trail: [],
      dodged: false
    });
  }

  // --- Rank Check ---
  function updateRankDisplay() {
    const rank = getActiveRank();
    if (rank.name !== currentRank) {

  // --- Main Update Loop ---
  let lastFrameTime = performance.now();

  function update(dt) {
    if (isGameOver) return;

    elapsedTime = (performance.now() - startTime) / 1000;
    updateRankDisplay();

    // Spawning timer (dynamic interval based on selected mode & progression)
    const activeRank = getActiveRank();
    let baseInterval = activeRank.spawnInterval;
    if (selectedMode === 'Auto') {
      baseInterval = Math.max(0.30, activeRank.spawnInterval - (elapsedTime / 180) * 0.4);
    }
    spawnInterval = baseInterval;

    nextSpawnTime -= dt;
    if (nextSpawnTime <= 0) {
      spawnSkillshot();
      nextSpawnTime = spawnInterval + (Math.random() * 0.2 - 0.1);
    }

    // Abilities Cooldowns
    if (player.flashCd > 0) player.flashCd = Math.max(0, player.flashCd - dt);
    if (player.dashCd > 0) player.dashCd = Math.max(0, player.dashCd - dt);
    if (player.shieldActive) {
      player.shieldTime -= dt;
      if (player.shieldTime <= 0) player.shieldActive = false;
    }

    // Player Movement (WASD or Point-and-Click)
    if (controlMode === 'wasd') {
      let vx = 0;
      let vy = 0;
      if (keys['w'] || keys['arrowup']) vy -= 1;
      if (keys['s'] || keys['arrowdown']) vy += 1;
      if (keys['a'] || keys['arrowleft']) vx -= 1;
      if (keys['d'] || keys['arrowright']) vx += 1;

      if (vx !== 0 || vy !== 0) {
        const len = Math.sqrt(vx * vx + vy * vy);
        player.x += (vx / len) * player.speed * dt;
        player.y += (vy / len) * player.speed * dt;
      }
    } else {
      // Right Click destination movement
      if (player.isMoving) {
        const d = dist(player.x, player.y, player.destX, player.destY);
        const step = player.speed * dt;
        if (d <= step) {
          player.x = player.destX;
          player.y = player.destY;
          player.isMoving = false;
        } else {
          const angle = Math.atan2(player.destY - player.y, player.destX - player.x);
          player.x += Math.cos(angle) * step;
          player.y += Math.sin(angle) * step;
        }
      }
    }

    // Keep player inside arena
    const clampedPos = clampWorldPos(player.x, player.y, player.radius + 5);
    player.x = clampedPos.x;
    player.y = clampedPos.y;

    // Update Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Add to particle trail
      p.trail.unshift({ x: p.x, y: p.y, alpha: 0.7 });
      if (p.trail.length > 8) p.trail.pop();

      // Check collision with player
      const d = dist(player.x, player.y, p.x, p.y);
      if (d < player.radius + p.radius) {
        // Hit!
        if (player.shieldActive) {
          // Shield absorbed!
          player.shieldActive = false;
          addParticleBurst(player.x, player.y, '#0ac8b9', 24, 200);
          addFloatingText('BLOCKED!', player.x, player.y - 25, '#0ac8b9', 18);
          soundShield();
          projectiles.splice(i, 1);
          continue;
        } else {
          // Damage taken!
          player.hp -= p.damage;
          addParticleBurst(player.x, player.y, '#e84057', 30, 240);
          soundHit();
          combo = 0;
          updateComboDisplay();
          projectiles.splice(i, 1);

          if (player.hp <= 0) {
            triggerGameOver();
            return;
          }
          continue;
        }
      }

      // Close call bonus check (within 24px margin of projectile)
      if (!p.dodged && d < player.radius + p.radius + 24) {
        p.dodged = true;
        dodgeCount++;
        combo++;
        lastComboTime = performance.now();
        score += 50 * combo;
        soundCloseCall();
        addFloatingText(`CLOSE CALL! +${50 * combo}`, p.x, p.y - 15, '#0ac8b9', 14);
        updateComboDisplay();
      }

      // Out of bounds check
      const bounds = getWorldArenaBounds();
      const margin = 120;
      if (p.x < bounds.minX - margin || p.x > bounds.maxX + margin || 
          p.y < bounds.minY - margin || p.y > bounds.maxY + margin) {
        if (!p.dodged) {
          dodgeCount++;
          score += 20;
        }
        projectiles.splice(i, 1);
      }
    }

    // Update Lasers (Lux)
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.timer += dt;

      if (l.state === 'charging') {
        if (l.timer >= l.chargeTime) {
          l.state = 'firing';
          l.timer = 0;
          soundLaser();
          // Check laser hit on player
          // Line segment collision with circle
          const hit = checkLineCircleCollision(
            l.x1, l.y1,
            l.x1 + Math.cos(l.angle) * l.length,
            l.y1 + Math.sin(l.angle) * l.length,
            player.x, player.y, player.radius + l.width / 2
          );

          if (hit) {
            if (player.shieldActive) {
              player.shieldActive = false;
              addParticleBurst(player.x, player.y, '#0ac8b9', 30, 220);
              addFloatingText('BLOCKED!', player.x, player.y - 25, '#0ac8b9', 18);
            } else {
              player.hp -= 60;
              addParticleBurst(player.x, player.y, '#e84057', 35, 260);
              soundHit();
              combo = 0;
              updateComboDisplay();
              if (player.hp <= 0) {
                triggerGameOver();
                return;
              }
            }
          } else {
            dodgeCount++;
            score += 100;
            addFloatingText('LASER DODGE! +100', player.x, player.y - 25, '#f1c40f', 16);
          }
        }
      } else if (l.state === 'firing') {
        if (l.timer >= l.beamDuration) {
          lasers.splice(i, 1);
        }
      }
    }

    // Update Bombs (Ziggs)
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.timer += dt;
      if (b.timer >= b.fuse && !b.exploded) {
        b.exploded = true;
        addParticleBurst(b.x, b.y, '#f39c12', 30, 220);
        soundLaser();

        // Check AoE damage
        if (dist(player.x, player.y, b.x, b.y) <= b.radius + player.radius) {
          if (player.shieldActive) {
            player.shieldActive = false;
            addParticleBurst(player.x, player.y, '#0ac8b9', 24, 180);
            addFloatingText('BLOCKED!', player.x, player.y - 25, '#0ac8b9', 18);
          } else {
            player.hp -= 40;
            addParticleBurst(player.x, player.y, '#e84057', 30, 240);
            soundHit();
            combo = 0;
            updateComboDisplay();
            if (player.hp <= 0) {
              triggerGameOver();
              return;
            }
          }
        } else {
          dodgeCount++;
          score += 40;
        }
        bombs.splice(i, 1);
      }
    }

    // Combo Decay
    if (combo > 1 && performance.now() - lastComboTime > 3500) {
      combo = 0;
      updateComboDisplay();
    }

    // Score over time
    score += Math.round(dt * 15);

    // Update UI HUD
    updateHUD();
  }

  function checkLineCircleCollision(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return dist(x1, y1, cx, cy) <= r;

    const t = Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / lenSq));
    const nearestX = x1 + t * dx;
    const nearestY = y1 + t * dy;
    return dist(cx, cy, nearestX, nearestY) <= r;
  }

  function updateComboDisplay() {
    const el = document.getElementById('comboStreakText');
    if (combo >= 2) {
      el.textContent = `COMBO x${combo}!`;
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
  }

  function updateHUD() {
    // Timer formatting mm:ss.d
    const mins = Math.floor(elapsedTime / 60);
    const secs = Math.floor(elapsedTime % 60);
    const tenths = Math.floor((elapsedTime % 1) * 10);
    document.getElementById('timeVal').textContent = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${tenths}`;

    document.getElementById('dodgeVal').textContent = dodgeCount;
    document.getElementById('scoreVal').textContent = score;

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('pm_lol_best_score', bestScore);
    }
    document.getElementById('bestScoreVal').textContent = bestScore;

    // Abilities HUD CD overlays
    const flashRatio = player.flashCd / player.flashMaxCd;
    document.getElementById('flashOverlay').style.height = `${flashRatio * 100}%`;
    const flashText = document.getElementById('flashCdText');
    if (player.flashCd > 0) {
      flashText.textContent = player.flashCd.toFixed(1);
      flashText.style.display = 'block';
    } else {
      flashText.style.display = 'none';
    }

    const dashRatio = player.dashCd / player.dashMaxCd;
    document.getElementById('dashOverlay').style.height = `${dashRatio * 100}%`;
    const dashText = document.getElementById('dashCdText');
    if (player.dashCd > 0) {
      dashText.textContent = player.dashCd.toFixed(1);
      dashText.style.display = 'block';
    } else {
      dashText.style.display = 'none';
    }
  }

  function triggerGameOver() {
    isGameOver = true;
    soundHit();

    // Fill defeat modal
    const mins = Math.floor(elapsedTime / 60);
    const secs = Math.floor(elapsedTime % 60);
    const tenths = Math.floor((elapsedTime % 1) * 10);
    document.getElementById('modalTime').textContent = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${tenths}`;
    document.getElementById('modalDodges').textContent = dodgeCount;
    document.getElementById('modalScore').textContent = score;
    document.getElementById('modalRank').textContent = currentRank;

    document.getElementById('modal-overlay').classList.add('active');
  }

  // --- Render Loop ---
  function render() {
    ctx.clearRect(0, 0, width, height);

    // 1. Draw Summoner Arena Grid & Rune Accents
    drawArena();

    // 2. Draw Click Ripples
    drawClickRipples();

    // 3. Draw Ziggs Bombs
    drawBombs();

    // 4. Draw Lux Lasers
    drawLasers();

    // 5. Draw Projectiles & Trails
    drawProjectiles();

    // 6. Draw Player Champion
    drawPlayer();

    // 7. Draw Particles
    drawParticles();

    // 8. Draw Floating Texts
    drawFloatingTexts();
  }

  function drawArena() {
    ctx.save();
    const cx = width / 2;
    const cy = getScreenCenterY();
    const isIso = viewMode === 'isometric';
    const s = getScreenArenaBounds();
    const w = getWorldArenaBounds();

    // Platform corners in world space
    const pTL = worldToScreen(w.minX, w.minY, 0);
    const pTR = worldToScreen(w.maxX, w.minY, 0);
    const pBR = worldToScreen(w.maxX, w.maxY, 0);
    const pBL = worldToScreen(w.minX, w.maxY, 0);

    if (isIso) {
      // 3D Stone Wall Drop-off on bottom edge of Summoner platform
      const wallH = 18;
      ctx.fillStyle = '#060d15';
      ctx.beginPath();
      ctx.moveTo(pBL.x, pBL.y);
      ctx.lineTo(pBR.x, pBR.y);
      ctx.lineTo(pBR.x, pBR.y + wallH);
      ctx.lineTo(pBL.x, pBL.y + wallH);
      ctx.closePath();
      ctx.fill();

      // Lower wall cyan trim line
      ctx.strokeStyle = 'rgba(10, 200, 185, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pBL.x, pBL.y + wallH);
      ctx.lineTo(pBR.x, pBR.y + wallH);
      ctx.stroke();

      // Platform Ground Surface Fill
      const grad = ctx.createRadialGradient(cx, cy, 60, cx, cy, Math.max(width, height) * 0.65);
      grad.addColorStop(0, 'rgba(12, 28, 48, 0.65)');
      grad.addColorStop(0.7, 'rgba(6, 16, 28, 0.75)');
      grad.addColorStop(1, 'rgba(2, 8, 14, 0.9)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(pTL.x, pTL.y);
      ctx.lineTo(pTR.x, pTR.y);
      ctx.lineTo(pBR.x, pBR.y);
      ctx.lineTo(pBL.x, pBL.y);
      ctx.closePath();
      ctx.fill();

      // Platform Rim
      ctx.strokeStyle = 'rgba(200, 155, 60, 0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Isometric Grid Lines spanning the entire platform
      ctx.strokeStyle = 'rgba(30, 45, 60, 0.35)';
      ctx.lineWidth = 1;
      const stepX = 75;
      for (let x = w.minX + stepX; x < w.maxX; x += stepX) {
        const topP = worldToScreen(x, w.minY, 0);
        const botP = worldToScreen(x, w.maxY, 0);
        ctx.beginPath();
        ctx.moveTo(topP.x, topP.y);
        ctx.lineTo(botP.x, botP.y);
        ctx.stroke();
      }
      const stepY = 65;
      for (let y = w.minY + stepY; y < w.maxY; y += stepY) {
        const leftP = worldToScreen(w.minX, y, 0);
        const rightP = worldToScreen(w.maxX, y, 0);
        ctx.beginPath();
        ctx.moveTo(leftP.x, leftP.y);
        ctx.lineTo(rightP.x, rightP.y);
        ctx.stroke();
      }

      // Large Majestic Rune Circles (tilted ellipses scaled to arena)
      const arenaH = s.maxY - s.minY;
      const rOuter = Math.min(width * 0.30, arenaH * 0.48);
      const rMid = rOuter * 0.72;
      const rInner = rOuter * 0.44;

      ctx.strokeStyle = 'rgba(200, 155, 60, 0.22)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rOuter, rOuter * ISO_PITCH, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(cx, cy, rMid, rMid * ISO_PITCH, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(10, 200, 185, 0.2)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, rInner, rInner * ISO_PITCH, 0, 0, Math.PI * 2);
      ctx.stroke();

    } else {
      // 2D Flat Top-Down Arena
      ctx.strokeStyle = 'rgba(30, 40, 45, 0.4)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let x = w.minX; x <= w.maxX; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, w.minY);
        ctx.lineTo(x, w.maxY);
        ctx.stroke();
      }
      for (let y = w.minY; y <= w.maxY; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(w.minX, y);
        ctx.lineTo(w.maxX, y);
        ctx.stroke();
      }

      const arenaH = w.maxY - w.minY;
      const rOuter = Math.min(width * 0.28, arenaH * 0.42);
      ctx.strokeStyle = 'rgba(200, 155, 60, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, rOuter, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, rOuter * 0.7, 0, Math.PI * 2);
      ctx.stroke();

      // Boundary line
      ctx.strokeStyle = 'rgba(232, 64, 87, 0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.minX, w.minY, w.maxX - w.minX, w.maxY - w.minY);
    }
    ctx.restore();
  }

  function drawClickRipples() {
    const isIso = viewMode === 'isometric';
    const pitch = isIso ? ISO_PITCH : 1.0;
    for (let i = clickRipples.length - 1; i >= 0; i--) {
      const r = clickRipples[i];
      r.radius += 1.6;
      r.alpha -= 0.04;
      if (r.alpha <= 0) {
        clickRipples.splice(i, 1);
        continue;
      }
      const pos = worldToScreen(r.x, r.y, 0);
      ctx.save();
      ctx.strokeStyle = `rgba(46, 204, 113, ${r.alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, r.radius, r.radius * pitch, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Inner chevron
      ctx.fillStyle = `rgba(46, 204, 113, ${r.alpha * 0.8})`;
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, 2, 2 * pitch, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBombs() {
    const isIso = viewMode === 'isometric';
    const pitch = isIso ? ISO_PITCH : 1.0;
    for (const b of bombs) {
      const progress = b.timer / b.fuse;
      const gPos = worldToScreen(b.x, b.y, 0);
      ctx.save();

      // Ground warning ring
      ctx.strokeStyle = 'rgba(243, 156, 18, 0.65)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.ellipse(gPos.x, gPos.y, b.radius, b.radius * pitch, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Expanding danger fill
      ctx.fillStyle = `rgba(232, 64, 87, ${progress * 0.35})`;
      ctx.beginPath();
      ctx.ellipse(gPos.x, gPos.y, b.radius * progress, (b.radius * progress) * pitch, 0, 0, Math.PI * 2);
      ctx.fill();

      // Parabolic Arc Bomb in air
      const arcZ = isIso ? Math.sin(progress * Math.PI) * 90 : 0;
      const bombPos = worldToScreen(b.x, b.y, arcZ);

      // Shadow in isometric mode
      if (isIso && arcZ > 6) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(gPos.x, gPos.y, 14 * (1 - progress * 0.3), 14 * ISO_PITCH * (1 - progress * 0.3), 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.font = `${20 + (arcZ > 20 ? 4 : 0)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💣', bombPos.x, bombPos.y);
      ctx.restore();
    }
  }

  function drawLasers() {
    const isIso = viewMode === 'isometric';
    for (const l of lasers) {
      ctx.save();
      const endX = l.x1 + Math.cos(l.angle) * l.length;
      const endY = l.y1 + Math.sin(l.angle) * l.length;

      const p1 = worldToScreen(l.x1, l.y1, 0);
      const p2 = worldToScreen(endX, endY, 0);

      const widthScale = isIso ? 0.8 : 1.0;

      if (l.state === 'charging') {
        const pulse = 0.5 + Math.sin(l.timer * 20) * 0.5;
        ctx.strokeStyle = `rgba(232, 64, 87, ${0.4 + pulse * 0.4})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(232, 64, 87, 0.15)';
        ctx.lineWidth = l.width * widthScale;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else {
        // Lethal Beam
        ctx.strokeStyle = 'rgba(255, 70, 90, 0.9)';
        ctx.lineWidth = l.width * widthScale;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = l.width * 0.45 * widthScale;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawProjectiles() {
    const isIso = viewMode === 'isometric';
    const projZ = isIso ? 18 : 0;

    for (const p of projectiles) {
      ctx.save();

      // 1. Ground Shadow (in isometric mode)
      if (isIso) {
        const gPos = worldToScreen(p.x, p.y, 0);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(gPos.x, gPos.y, p.radius * 0.85, p.radius * ISO_PITCH * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Particle Trail
      for (let j = 0; j < p.trail.length; j++) {
        const pt = p.trail[j];
        const trailPos = worldToScreen(pt.x, pt.y, projZ);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = pt.alpha * (1 - j / p.trail.length) * 0.5;
        ctx.beginPath();
        ctx.arc(trailPos.x, trailPos.y, p.radius * (1 - j / p.trail.length * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. Projectile Body in Air
      const flyPos = worldToScreen(p.x, p.y, projZ);
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 15;
      ctx.shadowColor = p.color;

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(flyPos.x, flyPos.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      // Inner white core
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(flyPos.x, flyPos.y, p.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  function drawPlayer() {
    ctx.save();
    const isIso = viewMode === 'isometric';
    const gPos = worldToScreen(player.x, player.y, 0);
    const bodyElev = isIso ? 18 : 0;
    const bodyPos = { x: gPos.x, y: gPos.y - bodyElev };

    // 1. Moving destination line
    if (player.isMoving && controlMode === 'mouse') {
      const destPos = worldToScreen(player.destX, player.destY, 0);
      ctx.strokeStyle = 'rgba(46, 204, 113, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(gPos.x, gPos.y);
      ctx.lineTo(destPos.x, destPos.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 2. Ground Shadow underneath champion feet
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();
    ctx.ellipse(gPos.x, gPos.y + (isIso ? 3 : player.radius + 3), player.radius * 1.25, player.radius * (isIso ? ISO_PITCH * 0.8 : 0.5), 0, 0, Math.PI * 2);
    ctx.fill();

    // 3. Shield Aura (if active)
    if (player.shieldActive) {
      ctx.strokeStyle = 'rgba(10, 200, 185, 0.85)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#0ac8b9';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.ellipse(bodyPos.x, bodyPos.y, player.radius + 9, player.radius + (isIso ? 7 : 9), 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 4. Champion 3D Spherical Body
    const grad = ctx.createRadialGradient(bodyPos.x - 5, bodyPos.y - 6, 2, bodyPos.x, bodyPos.y, player.radius);
    grad.addColorStop(0, '#224d77');
    grad.addColorStop(0.65, '#0a1727');
    grad.addColorStop(1, '#02060b');

    ctx.fillStyle = grad;
    ctx.strokeStyle = '#c89b3c';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#c89b3c';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(bodyPos.x, bodyPos.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 5. Champion Facing Direction Pointer
    const ptrX = bodyPos.x + Math.cos(player.facingAngle) * (player.radius - 2);
    const ptrY = bodyPos.y + Math.sin(player.facingAngle) * (player.radius - 2) * (isIso ? 0.85 : 1.0);
    ctx.fillStyle = '#0ac8b9';
    ctx.beginPath();
    ctx.arc(ptrX, ptrY, 4, 0, Math.PI * 2);
    ctx.fill();

    // 6. Champion Icon/Letter in center
    ctx.fillStyle = '#f0e6d2';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚡', bodyPos.x, bodyPos.y);

    // 7. LoL Segmented Health Bar over Champion
    const barW = 60;
    const barH = 7;
    const barX = bodyPos.x - barW / 2;
    const barY = bodyPos.y - player.radius - 16;

    ctx.fillStyle = '#010a13';
    ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);

    const hpRatio = Math.max(0, player.hp / player.maxHp);
    ctx.fillStyle = hpRatio > 0.4 ? '#2ecc71' : (hpRatio > 0.2 ? '#f39c12' : '#e74c3c');
    ctx.fillRect(barX, barY, barW * hpRatio, barH);

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.lineWidth = 1;
    for (let s = 1; s <= 3; s++) {
      const segX = barX + (barW * (s / 4));
      ctx.beginPath();
      ctx.moveTo(segX, barY);
      ctx.lineTo(segX, barY + barH);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 0.016;
      p.y += p.vy * 0.016;
      p.alpha -= p.decay * 0.016;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      const sPos = worldToScreen(p.x, p.y, p.z || 12);
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(sPos.x, sPos.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const t = floatingTexts[i];
      t.y += t.vy * 0.016;
      t.lifetime -= 0.016;
      t.alpha = Math.max(0, t.lifetime / 0.9);
      if (t.lifetime <= 0) {
        floatingTexts.splice(i, 1);
        continue;
      }
      const sPos = worldToScreen(t.x, t.y, 25);
      ctx.save();
      ctx.globalAlpha = t.alpha;
      ctx.font = `bold ${t.size}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = t.color;
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.textAlign = 'center';
      ctx.fillText(t.text, sPos.x, sPos.y);
      ctx.restore();
    }
  }

  // --- Main Animation Loop ---
  function gameLoop(now) {
    requestAnimationFrame(gameLoop);

    if (document.hidden) {
      lastFrameTime = now;
      return;
    }

    const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    update(dt);
    render();
  }

  // Start game on load
  resetGame();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
